{% extends 'core/base.html' %}

{% block title %}Post yaratish{% endblock %}

{% block content %}
<style>
    .create-container {
        max-width: 700px;
        margin: 60px auto;
        padding: 0 20px;
    }

    .create-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 40px;
        box-shadow: var(--shadow);
    }

    .create-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .create-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        color: var(--white);
        font-size: 35px;
    }

    .create-header h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--dark);
        margin-bottom: 10px;
    }

    .create-header p {
        color: var(--gray);
        font-size: 15px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: var(--dark);
        font-weight: 600;
        font-size: 14px;
    }

    .form-group label i {
        color: var(--primary);
        width: 20px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 15px;
        transition: var(--transition);
        background: var(--light);
        font-family: 'Poppins', sans-serif;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--primary);
        background: var(--white);
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 200px;
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        color: var(--white);
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        letter-spacing: 1px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102,126,234,0.3);
    }

    .back-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
        color: var(--gray);
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
    }

    .back-link:hover {
        color: var(--primary);
    }

    @media (max-width: 480px) {
        .create-card {
            padding: 25px;
        }

        .create-header h1 {
            font-size: 24px;
        }
    }
</style>

<div class="create-container">
    <div class="create-card">
        <div class="create-header">
            <div class="create-icon">
                <i class="fas fa-plus-circle"></i>
            </div>
            <h1>Post yaratish</h1>
            <p>Yangi post yozing va baham ko'ring</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="title"><i class="fas fa-heading"></i> Sarlavha</label>
                <input type="text" id="title" name="title" placeholder="Post sarlavhasini kiriting" required>
            </div>

            <div class="form-group">
                <label for="content"><i class="fas fa-file-alt"></i> Kontent</label>
                <textarea id="content" name="content" placeholder="Post kontentini yozing..." required></textarea>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-check-circle"></i> Post yaratish</button>
        </form>

        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Bosh sahifaga qaytish</a>
    </div>
</div>
{% endblock %}
